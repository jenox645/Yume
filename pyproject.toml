[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (handled separately)
]

[tool.ruff.lint.per-file-ignores]
"pocket_yume.py" = ["E402"]  # imports after Python 3.10 version check
"tests/*" = ["E402"]         # imports after sys.path setup

[tool.bandit]
exclude_dirs = ["tests", "tools"]
skips = ["B310", "B404", "B603"]  # B310=urlopen (all localhost/GitHub), B404=import subprocess, B603=subprocess without shell

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true
