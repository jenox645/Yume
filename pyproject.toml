[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (handled separately)
]

[tool.ruff.lint.per-file-ignores]
"pocket_yume.py" = ["E402"]  # imports after Python 3.10 version check
"tests/*" = ["E402"]         # imports after sys.path setup
